name: screenscraper
description: Emulation scraper that uses ScreenScraper API V2 to match ROMs to games and fetch details. 
version: 0.2.0
repository: https://github.com/dsolonenko/screenscraper-api-dart

environment:
  sdk: ^3.8.0

dependencies:
  async: ^2.13.1
  crypto: ^3.0.7
  json_annotation: ^4.12.0
  pretty_http_logger: ^1.0.5
  convert: ^3.1.2
  crclib: ^3.0.0
  collection: ^1.19.1
  archive: ^4.2.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.2
  json_serializable: ^6.14.1
  build_runner: ^2.16.0
